# Publishes the site in site/ to GitHub Pages on every push to main.
# Pages is set to "GitHub Actions" as its source. The live table in the hero is
# built here from examples/helen-ailith.json with the repo's own bundle.mjs, so the
# page always shows what table.html does today. SKILL.md rides along, so the site's
# address works as the instruction link an agent follows.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the example table and gather the site
        run: |
          node bundle.mjs --data examples/helen-ailith.json --out site/table/index.html
          cp SKILL.md site/SKILL.md
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
